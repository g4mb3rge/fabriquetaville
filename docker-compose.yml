services:
  db:
    image: mysql:8.4
    container_name: fabriquetaville-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fabriquetaville
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
